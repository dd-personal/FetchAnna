name: Canary

# Runs the tests against the live sites (tagged #live) daily, to find out when a site changes. Not on every push,
# which they'd fail whenever a site is down. A failed scheduled run is emailed to whoever last changed this schedule.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # KOReader runs on LuaJIT.
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6

      - name: Install busted
        run: luarocks install busted

      # Uses SLUM, the sites as they answer without a key, and the curl build Kindles are given. Never an account's key,
      # which this workflow isn't given. SLUM answers GitHub's runners with a bot check, so its test shows as pending.
      - name: Test against the live sites
        run: busted --tags=live
